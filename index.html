<script>

window.isAdmin = false;

function notify(message){

    const n =
      document.getElementById(
      "notification");

    n.innerHTML = message;

    n.className =
      "p-4 rounded-xl text-center bg-orange-900";

    n.classList.remove("hidden");

    setTimeout(()=>{
      n.classList.add("hidden");
    },3000)

}

function switchView(view){

    document
    .querySelectorAll(
      '[id$="-view"]'
    )
    .forEach(v=>v.classList.add('hidden'));

    document
    .getElementById(
      view + "-view"
    )
    .classList.remove('hidden');

    document
    .querySelectorAll('.nav-btn')
    .forEach(b => b.classList.remove('nav-active', 'bg-grumpyRed'));
    
    // Highlight current
    event.currentTarget.classList.add('nav-active', 'bg-grumpyRed');

}

</script>

<script>

// =====================================
// GRUMPY DARTS V2 - LEAGUE ENGINE
// =====================================

window.appData = {

    league1: {
        players:[]
    },

    league2: {
        players:[]
    },

    fixtures: [],

    hallOfFame: []

};

const LEAGUE1_DOC = "league1";
const LEAGUE2_DOC = "league2";
const HOF_DOC = "hallOfFame";

// =====================================
// PLAYER MODEL
// =====================================

function createPlayer(name){

    return {

        id: crypto.randomUUID(),

        name,

        avatar: "",

        bio: "No bio added yet.",

        nights:[
            0,
            0,
            0,
            0,
            0
        ],

        legsWon:0,

        stats:{
            s180:0,
            highestCheckout:0,
            bestAverage:0
        }

    };

}

// =====================================
// TOTALS
// =====================================

function totalPoints(player){

    return player.nights.reduce(
        (a,b)=>a+b,
        0
    );

}

// =====================================
// SORTING ENGINE
// =====================================

function getSortedPlayers(league){

    return [...league.players].sort((a,b)=>{

        const totalA =
            totalPoints(a);

        const totalB =
            totalPoints(b);

        if(totalB !== totalA){

            return totalB - totalA;

        }

        return (
            b.legsWon -
            a.legsWon
        );

    });

}

// =====================================
// FIRESTORE SAVE
// =====================================

async function saveLeague(leagueKey){

    if(!window.firebaseDB)
        return;

    try{

        await window.firestore.setDoc(

            window.firestore.doc(
                window.firebaseDB,
                "grumpy-darts",
                leagueKey
            ),

            window.appData[leagueKey]

        );

    }
    catch(err){

        console.error(err);

    }

}

// =====================================
// FIRESTORE LOAD
// =====================================

function subscribeLeague(leagueKey){

    const docRef =
        window.firestore.doc(
            window.firebaseDB,
            "grumpy-darts",
            leagueKey
        );

    window.firestore.onSnapshot(

        docRef,

        snapshot=>{

            if(snapshot.exists()){

                window.appData[
                    leagueKey
                ] = snapshot.data();

            }
            else{

                saveLeague(
                    leagueKey
                );

            }

            renderLeague(
                leagueKey
            );
            renderProfiles();
            renderStats();

        }

    );

}

// =====================================
// PLAYER ADD
// =====================================

window.addPlayer = async function(
    leagueKey
){

    if(!window.isAdmin){

        notify(
            "Admin only"
        );

        return;
    }

    const playerName =
        prompt(
            "Player Name"
        );

    if(!playerName)
        return;

    window.appData[
        leagueKey
    ].players.push(

        createPlayer(
            playerName
        )

    );

    await saveLeague(
        leagueKey
    );
    renderProfiles();

}

// =====================================
// PLAYER DELETE
// =====================================

window.deletePlayer =
async function(
    leagueKey,
    playerId
){

    if(!window.isAdmin)
        return;

    if(
        !confirm(
            "Delete player?"
        )
    ) return;

    const league =
     window.appData[
      leagueKey
     ];

    league.players =
      league.players.filter(
       p=>p.id!==playerId
      );

    await saveLeague(
      leagueKey
    );
    renderProfiles();

}

// =====================================
// SCORE UPDATE
// =====================================

window.updateNightScore =
async function(

    leagueKey,
    playerId,
    nightIdx,
    value

){

    const league =
      window.appData[leagueKey];

    const player =
      league.players.find(
       p=>p.id===playerId
      );

    if(!player) return;

    player.nights[
        nightIdx
    ] =
    parseInt(value)||0;

    await saveLeague(
        leagueKey
    );

}

// =====================================
// LEGS UPDATE
// =====================================

window.updateLegsWon =
async function(

    leagueKey,
    playerId,
    value

){

    const league =
      window.appData[
       leagueKey
      ];

    const player =
      league.players.find(
        p=>p.id===playerId
      );

    if(!player) return;

    player.legsWon =
      parseInt(value)||0;

    await saveLeague(
      leagueKey
    );

}

// =====================================
// RENDER LEAGUE
// =====================================

function renderLeague(
    leagueKey
){

    const container =
     document.getElementById(
      leagueKey +
      "Container"
     );

    if(!container)
        return;

    const league =
     window.appData[
       leagueKey
     ];

    const players =
      getSortedPlayers(
       league
      );

    let html = "";

    if(players.length===0){

        html = `

        <div class="text-center py-10 text-gray-500">

            No players added yet.

            ${
                window.isAdmin
                ? '<div class="mt-4"><button onclick="addPlayer(\'' + leagueKey + '\')" class="bg-red-600 px-4 py-2 rounded-xl text-white font-bold">Add Player</button></div>'
                : ''
            }

        </div>

        `;

        container.innerHTML =
         html;

        return;

    }

    html += `

    <div class="overflow-x-auto">

    <table class="w-full text-left">

    <thead>

    <tr class="border-b border-orange-500 text-orange-400">

        <th class="p-2">Pos</th>
        <th class="p-2">Name</th>
        <th class="p-2">N1</th>
        <th class="p-2">N2</th>
        <th class="p-2">N3</th>
        <th class="p-2">N4</th>
        <th class="p-2">N5</th>
        <th class="p-2">Legs</th>
        <th class="p-2">Total</th>
        ${window.isAdmin ? '<th class="p-2">Action</th>' : ''}

    </tr>

    </thead>

    <tbody>

    `;

    players.forEach(
      (player,index)=>{

      html += `

      <tr class="border-b border-gray-800 hover:bg-black/40">

      <td class="p-2 font-black">

      ${index+1}

      </td>

      <td class="p-2 font-bold flex items-center gap-2">
      ${player.avatar ? `<img src="${player.avatar}" class="w-7 h-7 rounded-full object-cover">` : ''}
      ${player.name}
      </td>

      ${player.nights.map(

        (score,night)=>

        `<td class="p-2">

        <input
            value="${score}"

            onchange="updateNightScore(
            '${leagueKey}',
            '${player.id}',
            ${night},
            this.value
            )"

            class="w-14 bg-black border border-gray-700 rounded p-1 text-center text-white"

            ${!window.isAdmin ? 'disabled' : ''}

        >

        </td>`

      ).join("")}

      <td class="p-2">

      <input

        value="${player.legsWon}"

        onchange="updateLegsWon(
           '${leagueKey}',
           '${player.id}',
           this.value
        )"

        class="w-14 bg-black border border-gray-700 rounded p-1 text-center text-white"

        ${!window.isAdmin ? 'disabled' : ''}

      >

      </td>

      <td class="p-2 font-black text-red-500 text-lg">

      ${totalPoints(player)}

      </td>

      ${window.isAdmin ?

      `<td class="p-2">

        <button
          onclick="deletePlayer(
            '${leagueKey}',
            '${player.id}'
          )"

          class="text-red-500 font-bold px-2 py-1 bg-red-950/40 rounded hover:bg-red-900">

          ✕

        </button>

      </td>`

      :

      ''

      }

      </tr>

      `;

    });

    html += `

    </tbody>

    </table>

    </div>

    `;

    if(window.isAdmin){

        html += `

        <div class="mt-4">

            <button

              onclick="addPlayer('${leagueKey}')"

              class="bg-grumpyRed px-4 py-2 rounded-xl font-bold text-white">

                Add Player

            </button>

        </div>

        `;

    }

    container.innerHTML =
      html;

    updateDashboard();

}

// =====================================
// DASHBOARD UPDATE
// =====================================

function updateDashboard(){

    const allPlayers = [

        ...window.appData
        .league1.players,

        ...window.appData
        .league2.players

    ];

    if(allPlayers.length === 0) {
        document.getElementById("leaderCard").innerHTML = "--";
        return;
    }

    const leader =
      [...allPlayers].sort(
       (a,b)=>
        totalPoints(b)
        -
        totalPoints(a)
      )[0];

    document
      .getElementById(
         "leaderCard"
      )
      .innerHTML =
      leader.name;

}

// =====================================
// START LEAGUES
// =====================================

window.addEventListener(

   "load",

   ()=>{

     setTimeout(()=>{

      subscribeLeague(
        LEAGUE1_DOC
      );

      subscribeLeague(
        LEAGUE2_DOC
      );

     },1500);

   }

);

</script>

<script>

// =====================================
// FIXTURES ENGINE V2
// =====================================

const FIXTURES_DOC = "fixtures";

function createFixture(){

    return {

        id: crypto.randomUUID(),

        night:"Night 1",

        player1:"",

        player2:"",

        score1:null,

        score2:null,

        date:"",

        tikTokLink:"",

        league:"League 1",

        status:"Upcoming"

    };

}

function subscribeFixtures(){

    const docRef =
        window.firestore.doc(
            window.firebaseDB,
            "grumpy-darts",
            FIXTURES_DOC
        );

    window.firestore.onSnapshot(

        docRef,

        snapshot=>{

            if(snapshot.exists()){

                const data =
                    snapshot.data();

                window.appData.fixtures =
                    data.fixtures || [];

            }
            else{

                saveFixtures();

            }

            renderFixtures();

        }

    );

}

async function saveFixtures(){

    try{

        await window.firestore.setDoc(

            window.firestore.doc(
                window.firebaseDB,
                "grumpy-darts",
                FIXTURES_DOC
            ),

            {
                fixtures:
                    window.appData.fixtures
            }

        );

    }
    catch(err){

        console.error(err);

    }

}

window.addFixture =
async function(){

    if(!window.isAdmin){

        notify(
            "Admin only"
        );

        return;
    }

    const player1 =
        prompt(
         "Player 1"
        );

    if(!player1)
        return;

    const player2 =
        prompt(
         "Player 2"
        );

    if(!player2)
        return;

    const fixture =
        createFixture();

    fixture.player1 =
        player1;

    fixture.player2 =
        player2;

    window.appData
      .fixtures
      .push(fixture);

    await saveFixtures();
    renderFixtures();

}

window.deleteFixture =
async function(id){

    if(!window.isAdmin)
        return;

    if(
      !confirm(
       "Delete fixture?"
      )
    )
      return;

    window.appData.fixtures =
      window.appData.fixtures.filter(
        f=>f.id!==id
      );

    await saveFixtures();
    renderFixtures();

}

window.updateFixture =
async function(
    fixtureId,
    field,
    value
){

    const fixture =
        window.appData.fixtures.find(
            f=>f.id===fixtureId
        );

    if(!fixture)
        return;

    fixture[field] =
        value;

    await saveFixtures();

}

function renderFixtures(){

    const container =
      document.getElementById(
       "fixturesContainer"
      );

    if(!container)
        return;

    let html = "";

    if(
       !window.appData.fixtures ||
       window.appData.fixtures
       .length === 0
    ){

        html = `

        <div class="text-center py-10 text-gray-500">

            No fixtures created.

            ${
                window.isAdmin
                ?
                `<div class="mt-4">

                 <button
                  onclick="addFixture()"
                  class="bg-red-600 px-4 py-2 rounded-xl text-white font-bold">

                  Add Fixture

                 </button>

                 </div>`
                :
                ""
            }

        </div>

        `;

        container.innerHTML =
            html;

        return;

    }

    html +=
      `<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">`;

    window.appData.fixtures
      .forEach(fixture=>{

      let statusColour =
      "bg-gray-800";

      if(
        fixture.status ===
        "Live"
      ){

        statusColour =
        "bg-red-600";

      }

      if(
        fixture.status ===
        "Completed"
      ){

        statusColour =
        "bg-green-600";

      }

      html += `

      <div class="
      bg-grumpyCard
      rounded-xl
      p-4
      border
      border-gray-800">

      <div class="flex justify-between items-center">

      <span class="
      px-2 py-1
      rounded
      text-xs
      font-bold
      ${statusColour}">

      ${fixture.status}

      </span>

      ${
        window.isAdmin
        ?

        `<button
          onclick="
          deleteFixture(
          '${fixture.id}'
          )"
          class="text-red-400 font-bold">

          ✕
         </button>`

        :

        ""
      }

      </div>

      <div class="mt-3">

      <div class="
      text-orange-400
      text-sm
      font-bold">

      ${fixture.night}

      </div>

      <div class="mt-2 text-center py-2 bg-black/30 rounded-lg">

      <div class="font-bold text-lg">

      ${fixture.player1}

      </div>

 "load",

<script>
// =====================================
// PROFILES & AVATAR UPLOADER ENGINE
// =====================================

function renderProfiles() {
    const container = document.getElementById("profilesContainer");
    if(!container) return;

    const allPlayers = [
        ...window.appData.league1.players.map(p => ({...p, leagueKey: 'league1'})),
        ...window.appData.league2.players.map(p => ({...p, leagueKey: 'league2'}))
    ];

    if(allPlayers.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-500">No players found in League 1 or League 2. Add players via the League tabs first.</div>`;
        return;
    }

    let html = `<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;

    allPlayers.forEach(player => {
        html += `
        <div class="bg-grumpyCard rounded-2xl p-5 border border-gray-800 flex flex-col items-center text-center">
            <div class="relative w-24 h-24 mb-4">
                <img src="${player.avatar || 'https://via.placeholder.com/96?text=Avatar'}" 
                     class="w-24 h-24 rounded-full object-cover border-2 border-orange-500 shadow-lg">
            </div>

            <h3 class="text-xl font-black text-white">${player.name}</h3>
            <span class="text-xs uppercase px-2 py-0.5 mt-1 rounded bg-orange-950 text-orange-400 font-bold">
                ${player.leagueKey === 'league1' ? 'League 1' : 'League 2'}
            </span>

            <p class="mt-3 text-sm text-gray-300 italic bg-black/40 p-3 rounded-xl w-full">
                "${player.bio || 'No bio provided.'}"
            </p>

            ${window.isAdmin ? `
            <div class="mt-4 w-full space-y-2 border-t border-gray-800 pt-3">
                <label class="block text-xs text-left text-gray-400 font-bold">Upload PNG Avatar / Logo:</label>
                <input type="file" accept="image/png, image/jpeg" 
                       onchange="uploadPlayerAvatar('${player.leagueKey}', '${player.id}', this)"
                       class="w-full text-xs text-gray-400 file:mr-4 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-grumpyRed file:text-white hover:file:bg-red-700">

                <textarea 
                    onchange="updatePlayerBio('${player.leagueKey}', '${player.id}', this.value)"
                    placeholder="Player Bio / Nickname"
                    class="w-full p-2 bg-black text-xs text-white rounded border border-gray-700"
                    rows="2">${player.bio || ''}</textarea>
            </div>
            ` : ''}
        </div>
        `;
    });

    html += `</div>`;
    container.innerHTML = html;
}

window.uploadPlayerAvatar = async function(leagueKey, playerId, inputElement) {
    const file = inputElement.files[0];
    if(!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
        const base64Image = e.target.result;
        const league = window.appData[leagueKey];
        const player = league.players.find(p => p.id === playerId);
        if(player) {
            player.avatar = base64Image;
            await saveLeague(leagueKey);
            renderProfiles();
            renderLeague(leagueKey);
            notify("Avatar uploaded successfully!");
        }
    };
    reader.readAsDataURL(file);
}

window.updatePlayerBio = async function(leagueKey, playerId, bioText) {
    const league = window.appData[leagueKey];
    const player = league.players.find(p => p.id === playerId);
    if(player) {
        player.bio = bioText;
        await saveLeague(leagueKey);
    }
}

// =====================================
// HALL OF FAME ENGINE
// =====================================

function subscribeHOF() {
    const docRef = window.firestore.doc(window.firebaseDB, "grumpy-darts", HOF_DOC);
    window.firestore.onSnapshot(docRef, snapshot => {
        if(snapshot.exists()) {
            window.appData.hallOfFame = snapshot.data().entries || [];
        } else {
            saveHOF();
        }
        renderHOF();
    });
}

async function saveHOF() {
    try {
        await window.firestore.setDoc(
            window.firestore.doc(window.firebaseDB, "grumpy-darts", HOF_DOC),
            { entries: window.appData.hallOfFame }
        );
    } catch(err) {
        console.error(err);
    }
}

window.addHOFEntry = async function() {
    if(!window.isAdmin) return;
    const name = prompt("Winner / Legend Name:");
    if(!name) return;
    const achievement = prompt("What did they win / Description:");
    if(!achievement) return;

    window.appData.hallOfFame.push({
        id: crypto.randomUUID(),
        name,
        achievement
    });

    await saveHOF();
    renderHOF();
}

window.deleteHOFEntry = async function(id) {
    if(!window.isAdmin) return;
    if(!confirm("Delete this Hall of Fame entry?")) return;
    window.appData.hallOfFame = window.appData.hallOfFame.filter(e => e.id !== id);
    await saveHOF();
    renderHOF();
}

function renderHOF() {
    const container = document.getElementById("hofContainer");
    if(!container) return;

    let html = "";
    const entries = window.appData.hallOfFame || [];

    if(entries.length === 0) {
        html = `<div class="text-center py-10 text-gray-500">No Hall of Fame entries yet.</div>`;
    } else {
        html = `<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">`;
        entries.forEach(entry => {
            html += `
            <div class="bg-grumpyCard rounded-2xl p-6 border border-yellow-500/40 relative shadow-lg text-center">
                <div class="text-3xl mb-2">🏆</div>
                <h3 class="text-xl font-black text-yellow-400">${entry.name}</h3>
                <p class="mt-3 text-sm text-gray-300 bg-black/40 p-3 rounded-xl">${entry.achievement}</p>
                ${window.isAdmin ? `
                <button onclick="deleteHOFEntry('${entry.id}')" class="mt-4 text-xs bg-red-950 text-red-400 px-3 py-1 rounded hover:bg-red-900 font-bold">
                    Remove Entry
                </button>` : ''}
            </div>
            `;
        });
        html += `</div>`;
    }

    if(window.isAdmin) {
        html += `
        <div class="mt-6 text-center">
            <button onclick="addHOFEntry()" class="bg-grumpyRed px-5 py-2 rounded-xl font-bold text-white">
                Add Hall of Fame Entry
            </button>
        </div>`;
    }

    container.innerHTML = html;
}

<script>
// =====================================
// UPDATED STATISTICS & DASHBOARD ENGINE
// =====================================

// Update individual player stats (180s or Checkout)
window.updatePlayerStat = async function(leagueKey, playerId, statField, value) {
    if (!window.isAdmin) return;
    const league = window.appData[leagueKey];
    const player = league.players.find(p => p.id === playerId);
    if (!player) return;

    if (!player.stats) {
        player.stats = { s180: 0, highestCheckout: 0 };
    }

    player.stats[statField] = parseInt(value) || 0;
    await saveLeague(leagueKey);
    renderStats();
}

// Enhanced Dashboard Update
function updateDashboard(){
    const allPlayers = [
        ...window.appData.league1.players.map(p => ({...p, leagueKey: 'league1'})),
        ...window.appData.league2.players.map(p => ({...p, leagueKey: 'league2'}))
    ];

    if(allPlayers.length === 0) {
        document.getElementById("leaderCard").innerHTML = "--";
        document.getElementById("most180sCard").innerHTML = "--";
        document.getElementById("checkoutCard").innerHTML = "--";
        return;
    }

    // 1. League Leader (by points)
    const leader = [...allPlayers].sort((a,b) => totalPoints(b) - totalPoints(a))[0];
    document.getElementById("leaderCard").innerHTML = leader ? leader.name : "--";

    // 2. Most 180s Leader
    const top180 = [...allPlayers].sort((a,b) => (b.stats?.s180 || 0) - (a.stats?.s180 || 0))[0];
    if (top180 && (top180.stats?.s180 || 0) > 0) {
        document.getElementById("most180sCard").innerHTML = `${top180.name} (${top180.stats.s180})`;
    } else {
        document.getElementById("most180sCard").innerHTML = "0";
    }

    // 3. Highest Checkout Leader
    const topCheckout = [...allPlayers].sort((a,b) => (b.stats?.highestCheckout || 0) - (a.stats?.highestCheckout || 0))[0];
    if (topCheckout && (topCheckout.stats?.highestCheckout || 0) > 0) {
        document.getElementById("checkoutCard").innerHTML = `${topCheckout.name} (${topCheckout.stats.highestCheckout})`;
    } else {
        document.getElementById("checkoutCard").innerHTML = "0";
    }
}

// Render Statistics View with Admin Edit Inputs
function renderStats() {
    const container = document.getElementById("statsContainer");
    if(!container) return;

    const allPlayers = [
        ...window.appData.league1.players.map(p => ({...p, leagueKey: 'league1'})),
        ...window.appData.league2.players.map(p => ({...p, leagueKey: 'league2'}))
    ];

    if(allPlayers.length === 0) {
        container.innerHTML = `<div class="text-center py-10 text-gray-500">No players available for statistics.</div>`;
        return;
    }

    let html = `
    <div class="overflow-x-auto">
    <table class="w-full text-left">
        <thead>
            <tr class="border-b border-orange-500 text-orange-400">
                <th class="p-3">Player</th>
                <th class="p-3">League</th>
                <th class="p-3">Legs Won</th>
                <th class="p-3">Total Points</th>
                <th class="p-3">180s Hit</th>
                <th class="p-3">Highest Checkout</th>
            </tr>
        </thead>
        <tbody>
    `;

    allPlayers.sort((a,b) => totalPoints(b) - totalPoints(a)).forEach(p => {
        const stats = p.stats || { s180: 0, highestCheckout: 0 };
        html += `
        <tr class="border-b border-gray-800 hover:bg-black/40">
            <td class="p-3 font-bold flex items-center gap-2">
                ${p.avatar ? `<img src="${p.avatar}" class="w-6 h-6 rounded-full object-cover">` : ''}
                ${p.name}
            </td>
            <td class="p-3 text-xs uppercase text-gray-400 font-semibold">${p.leagueKey === 'league1' ? 'League 1' : 'League 2'}</td>
            <td class="p-3 font-semibold text-yellow-400">${p.legsWon}</td>
            <td class="p-3 font-black text-red-500">${totalPoints(p)}</td>
            <td class="p-3">
                <input type="number" value="${stats.s180}" 
                    onchange="updatePlayerStat('${p.leagueKey}', '${p.id}', 's180', this.value)"
                    class="w-16 bg-black border border-gray-700 rounded p-1 text-center text-white font-bold"
                    ${!window.isAdmin ? 'disabled' : ''}>
            </td>
            <td class="p-3">
                <input type="number" value="${stats.highestCheckout}" 
                    onchange="updatePlayerStat('${p.leagueKey}', '${p.id}', 'highestCheckout', this.value)"
                    class="w-16 bg-black border border-gray-700 rounded p-1 text-center text-white font-bold"
                    ${!window.isAdmin ? 'disabled' : ''}>
            </td>
        </tr>`;
    });

    html += `</tbody></table></div>`;
    container.innerHTML = html;
    updateDashboard();
}
</script>
    
</body>
</html>
